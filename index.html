<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | วัฒนานนท์ กิมประพันธ์</title>
    <meta name="description" content="Portfolio ของวัฒนานนท์ กิมประพันธ์">

                (ระบบไฟฟ้า อิเล็กทรอนิกส์กำลัง และพลังงาน)</p>
            </div>
        </section>

        <section class="pages" aria-label="Portfolio pages">
            <article class="page-card">
                <span class="page-number">01</span>
